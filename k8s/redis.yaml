# Redis Deployment + Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codemind-redis
  namespace: codemind
  labels:
    app: codemind-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codemind-redis
  template:
    metadata:
      labels:
        app: codemind-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["--appendonly", "yes"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: codemind-redis
  namespace: codemind
spec:
  selector:
    app: codemind-redis
  ports:
    - port: 6379
      targetPort: 6379
