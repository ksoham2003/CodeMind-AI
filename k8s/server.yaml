# Node.js API Server Deployment + Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codemind-server
  namespace: codemind
  labels:
    app: codemind-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codemind-server
  template:
    metadata:
      labels:
        app: codemind-server
    spec:
      containers:
        - name: server
          image: codemindai-server:v14  # Built from ./server
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: codemind-config
            - secretRef:
                name: codemind-secrets
          env:
            # Override START_WORKER for the API server (worker pod handles jobs)
            - name: START_WORKER
              value: "false"
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: codemind-server
  namespace: codemind
spec:
  selector:
    app: codemind-server
  ports:
    - port: 5000
      targetPort: 5000
      name: http
