# Horizontal Pod Autoscaler — Server
# Scales codemind-server between 2 and 10 replicas based on CPU/memory
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codemind-server-hpa
  namespace: codemind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codemind-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Horizontal Pod Autoscaler — Worker
# Scales workers based on queue depth (CPU as proxy)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codemind-worker-hpa
  namespace: codemind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codemind-worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

---
# Horizontal Pod Autoscaler — Client (Nginx)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codemind-client-hpa
  namespace: codemind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codemind-client
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
