apiVersion: v1
kind: Secret
metadata:
  name: codemind-secrets
  namespace: codemind
type: Opaque
stringData:
  # Required — generate with: openssl rand -base64 32
  JWT_SECRET: "REPLACE_ME"

  # OpenAI API key — https://platform.openai.com/api-keys
  OPENAI_API_KEY: "REPLACE_ME"

  # Groq fallback (optional but recommended) — https://console.groq.com
  GROQ_API_KEY: "REPLACE_ME"

  # MongoDB Atlas connection string
  # Format: mongodb+srv://<user>:<password>@cluster0.xxxxx.mongodb.net/codemind?retryWrites=true&w=majority
  MONGODB_URI: "REPLACE_ME"

  # Redis — Upstash Redis REST URL format: rediss://:password@host:6379
  REDIS_URL: "REPLACE_ME"

  # GitHub token (for cloning private repos)
  GITHUB_TOKEN: "REPLACE_ME"

  # Pinecone (if used for vector store)
  PINECONE_API_KEY: "REPLACE_ME"
  PINECONE_INDEX_NAME: "codemind2"
