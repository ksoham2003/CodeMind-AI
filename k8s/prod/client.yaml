# Nginx Client — Production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codemind-client
  namespace: codemind
  labels:
    app: codemind-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codemind-client
  template:
    metadata:
      labels:
        app: codemind-client
    spec:
      containers:
        - name: client
          image: IMAGE_CLIENT  # Replaced by CI/CD
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: codemind-client
  namespace: codemind
spec:
  selector:
    app: codemind-client
  ports:
    - port: 80
      targetPort: 80
      name: http
