apiVersion: v1
kind: ConfigMap
metadata:
  name: codemind-config
  namespace: codemind
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_URL: "https://codemind.yourdomain.com"
  ALLOWED_ORIGINS: "https://codemind.yourdomain.com"

  # MongoDB Atlas — connection string set via Secret
  # MONGODB_URI is in the secret

  # Redis — Upstash or ElastiCache
  # REDIS_URL is in the secret

  # LLM — OpenAI
  LOCAL_LLM_ENABLED: "false"
  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-4o-mini"
  LLM_CHAT_MODEL: "gpt-4o-mini"
  LLM_FALLBACK_PRIORITY: "openai,groq"

  # Embedding — Ollama (in-cluster) or switch to "openai"
  EMBEDDING_PROVIDER: "ollama"
  EMBEDDING_LOCAL_URL: ""

  # Worker
  QUEUE_CONCURRENCY: "4"
  START_WORKER: "false"

  # Chunking
  EMBED_CHUNK_STRATEGY: "selective"
  SELECTIVE_MIN_CHARS: "180"
  MAX_CHUNK_CHARS: "2500"
  MAX_REPO_CHUNKS: "2500"
  EMBED_BATCH_SIZE: "128"
  EMBED_RETRY_ATTEMPTS: "5"
  EMBED_RETRY_BASE_DELAY: "300"

  # Metrics
  METRICS_SNAPSHOTTER_ENABLED: "true"
  METRICS_SNAPSHOT_INTERVAL_MS: "60000"
  EMBEDDING_METRICS_HISTORY_MAX: "720"
  EMBEDDING_COST_PER_1K_USD: "0.00"
