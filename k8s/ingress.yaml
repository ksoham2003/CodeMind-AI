# NGINX Ingress + TLS via cert-manager (Let's Encrypt)
# Prerequisites:
#   1. Install AWS Load Balancer Controller (for EKS):
#      https://docs.aws.amazon.com/eks/latest/userguide/aws-load-balancer-controller.html
#   2. Install cert-manager:
#      kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   3. Create a ClusterIssuer (see below)
#   4. Point your domain DNS to the ALB address
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com   # ← REPLACE with your email
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codemind-ingress
  namespace: codemind
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # WebSocket support (for Socket.io)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - codemind.yourdomain.com    # ← REPLACE with your domain
      secretName: codemind-tls
  rules:
    - host: codemind.yourdomain.com  # ← REPLACE with your domain
      http:
        paths:
          # API and WebSocket traffic → server
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codemind-server
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: codemind-server
                port:
                  number: 5000
          # All other traffic → client (SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codemind-client
                port:
                  number: 80
